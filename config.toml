# ------------------------------------------------------------
#  Monetisation channel 2: own digital products (guides / templates)
#  Generated automatically into content/products/. Sell them with a
#  Stripe Payment Link or Gumroad: create one link per product and map
#  slug -> URL below. Products without a link show an email-capture CTA.
# ------------------------------------------------------------
[checkout]
default_price = "$19"
"the-small-team-ai-operating-manual" = "https://buy.stripe.com/cNi5kE4QX0GPdCt0SzdfG00"
# "ai-automation-playbook" = "https://buy.stripe.com/xxxx"

[checkout_policy]
refund_days = 30

[indexnow]
enabled = true             # ping Bing/Yandex/Seznam etc. with new URLs after each deploy

