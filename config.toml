# ============================================================
#  AI Earning Machine — 主配置 / main configuration
#  只改这一个文件就能切换赛道、语言、变现方式。
#  Secrets (API keys) NEVER go here — use env vars / GitHub Secrets.
# ============================================================

[site]
name = "Northlight Guide"
tagline = "Practical, honest guides to money, family, learning and the AI tools that make life easier."
# Final public URL. With GitHub Pages this is https://<user>.github.io/<repo>
base_url = "https://shengchen424-sketch.github.io/AI-AUTOMATED-EARNING-MACHINE"
language = "en"            # "en" = bigger affiliate market; "zh" also works
author = "Northlight Guide Editorial"
business_name = "Northlight Guide"   # must match the business name on your Stripe account
contact_email = "shengchen424@gmail.com"   # public support email shown on Contact / Refund pages

[autopilot]
articles_per_run = 3       # keep modest: quality > volume (search engines penalise spam)
products_per_run = 1       # new digital product only when the catalog is below max_products
max_products = 12
model = "claude-opus-5-5"
effort = "high"
editor_pass = true         # second "senior editor" pass on every article (better quality, 2x usage)
upgrades_per_run = 2       # re-edit older articles into the newest format each run

# ------------------------------------------------------------
#  Topics (niches). Each run picks the LEAST-covered topics first, so the
#  site grows evenly across categories. `care` adds stricter writing rules
#  and an on-page disclaimer:
#    care = "finance" -> education only, no personal investment advice
#    care = "health"  -> follows mainstream medical guidance, "ask your doctor"
# ------------------------------------------------------------
[[niches]]
name = "AI tools for small business productivity"
section = "AI & Work"

[[niches]]
name = "AI writing and content tools for freelancers"
section = "AI & Work"

[[niches]]
