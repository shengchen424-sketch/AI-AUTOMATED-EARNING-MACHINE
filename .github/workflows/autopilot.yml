name: autopilot

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"   # 4 runs a day (every 6 hours)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.toml", "templates/**", "earnbot/**", "static/**"]

permissions:
  actions: write
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI (runs on your Claude Max subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Generate content, products and site
        env:
          # Subscription token from `claude setup-token` — no API key, no per-token billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only scheduled/manual runs use your plan's quota; pushes just rebuild the site.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          python -m earnbot run

      - name: Commit new content
        if: github.event_name != 'push'   # push runs only rebuild the site
        run: |
          git config user.name "earnbot"
          git config user.email "earnbot@users.noreply.github.com"
          git add content data
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: new content $(date -u +%F)"
          # Another run may have pushed meanwhile: replay our commit on top, then push.
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report to owner (GitHub issue = email notification + job summary)
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f report.md ] || exit 0
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # Don't email an empty report when the plan's usage limit was hit; the next real run reports.
          if grep -q "新文章 0 篇" report.md && grep -q "hit your" report.md; then exit 0; fi
          gh issue create --title "📊 自动运行报告 $(date -u +%F)" --body-file report.md || true

      - name: Burst mode — start the next run right away
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m earnbot burst || exit 0
          # If this run produced nothing, wait: until the plan's usage limit resets (time is in the
          # error message), else 15 minutes. Capped at 5h to stay inside the 6h job limit.
          if [ "${{ github.event_name }}" != "push" ] && ! grep -q "新文章 [1-9]" report.md 2>/dev/null; then
            reset=$(grep -o -E "resets [0-9]{1,2}(:[0-9]{2})?(am|pm) \(UTC\)" report.md | head -1 | sed -E 's/resets ([^ ]+) .*/\1/')
            wait=900
            if [ -n "$reset" ]; then
              target=$(date -u -d "$reset" +%s 2>/dev/null || echo 0); now=$(date -u +%s)
              [ "$target" -le "$now" ] && target=$((target + 86400))
              wait=$((target - now + 120)); [ $wait -gt 18000 ] && wait=18000
            fi
            echo "nothing produced; sleeping ${wait}s (limit reset: ${reset:-unknown})"; sleep $wait
          fi
          gh workflow run autopilot.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"

      - name: Keep paid deliverables private (download from the run's artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: deliverables-${{ github.run_id }}
          path: deliverables/
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # includes the content committed by this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver...)
        run: python -m earnbot indexnow

  promote:
    # Posts new articles/playbooks to every social channel whose secrets are set (after the site is live).
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Auto-post to social channels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python -m earnbot promote
      - name: Save posting log
        run: |
          git config user.name "earnbot"
          git config user.email "earnbot@users.noreply.github.com"
          git add data/marketing
          git diff --cached --quiet && exit 0
          git commit -m "marketing: posting log $(date -u +%F)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
