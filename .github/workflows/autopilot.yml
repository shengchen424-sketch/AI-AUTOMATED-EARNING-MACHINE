name: autopilot

on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.toml", "templates/**", "earnbot/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI (runs on your Claude Max subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Generate content, products and site
        env:
          # Subscription token from `claude setup-token` — no API key, no per-token billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only scheduled/manual runs use your plan's quota; pushes just rebuild the site.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          python -m earnbot run

      - name: Commit new content
        if: github.event_name != 'push'   # push runs only rebuild the site
        run: |
          git config user.name "earnbot"
          git config user.email "earnbot@users.noreply.github.com"
          git add content data
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: new content $(date -u +%F)"
          # Another run may have pushed meanwhile: replay our commit on top, then push.
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report to owner (GitHub issue = email notification + job summary)
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f report.md ] || exit 0
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "📊 自动运行报告 $(date -u +%F)" --body-file report.md || true

      - name: Keep paid deliverables private (download from the run's artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: deliverables-${{ github.run_id }}
          path: deliverables/
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # includes the content committed by this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver...)
        run: python -m earnbot indexnow
