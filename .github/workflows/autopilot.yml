name: autopilot

on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.toml", "templates/**", "earnbot/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Generate content, products and site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        # Only the scheduled/manual runs spend API credits; pushes just rebuild.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then unset ANTHROPIC_API_KEY; fi
          python -m earnbot run

      - name: Commit new content
        run: |
          git config user.name "earnbot"
          git config user.email "earnbot@users.noreply.github.com"
          git add content data
          git diff --cached --quiet || (git commit -m "autopilot: new content $(date -u +%F)" && git push)

      - name: Keep paid deliverables private (download from the run's artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: deliverables-${{ github.run_id }}
          path: deliverables/
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
